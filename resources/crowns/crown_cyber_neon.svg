<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="neon_cyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </linearGradient>
    <linearGradient id="cyber_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="cyber_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#00F0FF"/>
      <stop offset="70%" stop-color="#7000FF"/>
      <stop offset="100%" stop-color="#FF007F"/>
    </radialGradient>
    <filter id="neon_glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00F0FF" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF007F" flood-opacity="0.8"/>
    </filter>
  </defs>

  <g filter="url(#neon_glow)">
    <!-- Holographic Light Rays Shooting Up -->
    <line x1="64" y1="12" x2="64" y2="44" stroke="#00F0FF" stroke-width="2" stroke-dasharray="3 2"/>
    <line x1="38" y1="28" x2="48" y2="60" stroke="#FF007F" stroke-width="1.8" stroke-dasharray="3 2"/>
    <line x1="90" y1="28" x2="80" y2="60" stroke="#FF007F" stroke-width="1.8" stroke-dasharray="3 2"/>

    <!-- Holographic Vertex Node Points -->
    <circle cx="64" cy="12" r="3.5" fill="#FFFFFF" stroke="#00F0FF" stroke-width="1.5"/>
    <circle cx="38" cy="28" r="3" fill="#FFFFFF" stroke="#FF007F" stroke-width="1.5"/>
    <circle cx="90" cy="28" r="3" fill="#FFFFFF" stroke="#FF007F" stroke-width="1.5"/>
    <circle cx="16" cy="46" r="2.5" fill="#00F0FF"/>
    <circle cx="112" cy="46" r="2.5" fill="#00F0FF"/>

    <!-- Digital Crown Frame / Geometric Laser Spikes -->
    <polygon points="16,92 24,50 40,68 64,20 88,68 104,50 112,92 88,86 64,94 40,86" 
             fill="url(#cyber_dark)" stroke="url(#neon_cyber)" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Circuit Traces & Neon Grid Lines -->
    <path d="M24 50 L38 68 L64 36 L90 68 L104 50" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M40 86 L64 56 L88 86" fill="none" stroke="#FF007F" stroke-width="1.5"/>

    <!-- Central Quantum Core Unit (Hexagonal) -->
    <polygon points="64,48 74,54 74,66 64,72 54,66 54,54" fill="url(#cyber_core)" stroke="#FFFFFF" stroke-width="1.8"/>
    <circle cx="64" cy="60" r="3" fill="#FFFFFF"/>

    <!-- Cyber Base Visor Band -->
    <rect x="14" y="90" width="100" height="20" rx="4" fill="#030712" stroke="#00F0FF" stroke-width="2"/>
    <rect x="18" y="93" width="92" height="14" rx="2" fill="url(#neon_cyber)" opacity="0.4"/>

    <!-- Circuit Data Bits on Base -->
    <line x1="24" y1="100" x2="44" y2="100" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="100" r="2.5" fill="#FFFFFF" stroke="#00F0FF" stroke-width="1"/>
    
    <polygon points="64,94 70,100 64,106 58,100" fill="#FF007F" stroke="#FFFFFF" stroke-width="1"/>

    <line x1="104" y1="100" x2="84" y2="100" stroke="#00F0FF" stroke-width="2" stroke-linecap="round"/>
    <circle cx="80" cy="100" r="2.5" fill="#FFFFFF" stroke="#00F0FF" stroke-width="1"/>
  </g>
</svg>
