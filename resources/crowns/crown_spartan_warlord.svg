<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bronze_armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#D97706"/>
      <stop offset="70%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <linearGradient id="spartan_crest_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="80%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </linearGradient>
    <filter id="spartan_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#DC2626" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#spartan_glow)">
    <!-- Tall Curved Transverse Horsehair Crest (Plumage) -->
    <path d="M22 68 C24 32 38 12 64 8 C90 12 104 32 106 68 C96 46 84 32 64 28 C44 32 32 46 22 68 Z" 
          fill="url(#spartan_crest_grad)" stroke="#7F1D1D" stroke-width="1.8"/>

    <!-- Fine Hair Plume Texture Lines -->
    <g stroke="#FCA5A5" stroke-width="1" opacity="0.65" stroke-linecap="round">
      <line x1="64" y1="8" x2="64" y2="28"/>
      <line x1="52" y1="12" x2="55" y2="30"/>
      <line x1="76" y1="12" x2="73" y2="30"/>
      <line x1="40" y1="20" x2="46" y2="35"/>
      <line x1="88" y1="20" x2="82" y2="35"/>
      <line x1="30" y1="36" x2="38" y2="48"/>
      <line x1="98" y1="36" x2="90" y2="48"/>
    </g>

    <!-- Crest Holder / Bronze Channel -->
    <path d="M30 64 C38 40 48 30 64 28 C80 30 90 40 98 64 C86 52 76 46 64 45 C52 46 42 52 30 64 Z" 
          fill="url(#bronze_armor)" stroke="#451A03" stroke-width="1.8"/>

    <!-- Corinthian Helmet Forehead & Crown Spikes -->
    <path d="M16 92 L26 62 L42 76 L64 42 L86 76 L102 62 L112 92 Z" 
          fill="url(#bronze_armor)" stroke="#451A03" stroke-width="2" stroke-linejoin="round"/>

    <!-- Helmet Center Nose-Guard / Brow Ridge Shading -->
    <polygon points="64,44 54,72 64,88 74,72" fill="#B45309" opacity="0.4"/>
    <line x1="64" y1="44" x2="64" y2="88" stroke="#FEF3C7" stroke-width="1.5"/>

    <!-- Spartan Lambda (Λ) War Symbol in Center -->
    <path d="M64 56 L52 82 H58 L64 68 L70 82 H76 Z" fill="#DC2626" stroke="#450A0A" stroke-width="1"/>

    <!-- Heavy Bronze Base Rim with Battle Studs -->
    <rect x="14" y="90" width="100" height="20" rx="3" fill="#78350F" stroke="#451A03" stroke-width="2"/>
    <rect x="16" y="92" width="96" height="16" rx="2" fill="url(#bronze_armor)"/>

    <!-- Bronze Rivets & Ruby War Gem -->
    <ellipse cx="64" cy="100" rx="6" ry="5" fill="#DC2626" stroke="#FEF3C7" stroke-width="1.2"/>
    <circle cx="28" cy="100" r="3.5" fill="#451A03" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="46" cy="100" r="3.5" fill="#451A03" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="82" cy="100" r="3.5" fill="#451A03" stroke="#FDE68A" stroke-width="1"/>
    <circle cx="100" cy="100" r="3.5" fill="#451A03" stroke="#FDE68A" stroke-width="1"/>
  </g>
</svg>
