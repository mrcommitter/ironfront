<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="gold_body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="35%" stop-color="#FFD700"/>
      <stop offset="70%" stop-color="#DAA520"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <linearGradient id="gold_rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE875"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#6B4E00"/>
    </linearGradient>
    <radialGradient id="ruby_gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF758C"/>
      <stop offset="40%" stop-color="#E11D48"/>
      <stop offset="90%" stop-color="#880826"/>
      <stop offset="100%" stop-color="#4C0519"/>
    </radialGradient>
    <radialGradient id="sapphire_gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="40%" stop-color="#0284C7"/>
      <stop offset="90%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#082F49"/>
    </radialGradient>
    <radialGradient id="emerald_gem" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="40%" stop-color="#059669"/>
      <stop offset="90%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </radialGradient>
    <filter id="crown_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFD700" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#crown_glow)">
    <!-- Velvet Cap Interior -->
    <path d="M26 92 C26 58 40 40 64 38 C88 40 102 58 102 92 Z" fill="#831843" opacity="0.9"/>
    <path d="M42 45 C52 40 76 40 86 45 C78 72 50 72 42 45 Z" fill="#9D174D" opacity="0.6"/>

    <!-- Central Cross Finial -->
    <path d="M61 14 H67 V22 H75 V28 H67 V36 H61 V28 H53 V22 H61 Z" fill="url(#gold_body)" stroke="#B45309" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="64" cy="25" r="2.5" fill="url(#ruby_gem)"/>

    <!-- Arch Framework -->
    <path d="M64 36 C55 48 35 60 22 75 C30 82 45 68 64 54 C83 68 98 82 106 75 C93 60 73 48 64 36 Z" fill="url(#gold_rim)" opacity="0.85"/>

    <!-- Main Spikes / Crown Body -->
    <path d="M16 92 L22 55 L38 72 L64 36 L90 72 L106 55 L112 92 Z" fill="url(#gold_body)" stroke="#78350F" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Shading & Highlights on Peaks -->
    <path d="M64 36 L52 64 L64 88 L76 64 Z" fill="#FFFBEB" opacity="0.25"/>
    <path d="M22 55 L32 70 L20 86 Z" fill="#FFFBEB" opacity="0.2"/>
    <path d="M106 55 L96 70 L108 86 Z" fill="#78350F" opacity="0.3"/>

    <!-- Base Rim -->
    <rect x="14" y="90" width="100" height="20" rx="4" fill="url(#gold_rim)" stroke="#78350F" stroke-width="2"/>
    <rect x="18" y="94" width="92" height="12" rx="2" fill="#581C87" opacity="0.3"/>

    <!-- Pearls on Peaks -->
    <circle cx="22" cy="54" r="4.5" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <circle cx="22" cy="54" r="2" fill="#FEF08A"/>
    <circle cx="106" cy="54" r="4.5" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <circle cx="106" cy="54" r="2" fill="#FEF08A"/>
    <circle cx="38" cy="71" r="3.5" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>
    <circle cx="90" cy="71" r="3.5" fill="#FFFFFF" stroke="#D97706" stroke-width="1"/>

    <!-- Jewels on Rim -->
    <ellipse cx="64" cy="100" rx="6" ry="5" fill="url(#ruby_gem)" stroke="#FFD700" stroke-width="1.2"/>
    <ellipse cx="36" cy="100" rx="5" ry="4" fill="url(#sapphire_gem)" stroke="#FFD700" stroke-width="1.2"/>
    <ellipse cx="92" cy="100" rx="5" ry="4" fill="url(#emerald_gem)" stroke="#FFD700" stroke-width="1.2"/>
    <circle cx="22" cy="100" r="3" fill="#FFFFFF" stroke="#B45309" stroke-width="0.8"/>
    <circle cx="50" cy="100" r="2.5" fill="#FFFFFF" stroke="#B45309" stroke-width="0.8"/>
    <circle cx="78" cy="100" r="2.5" fill="#FFFFFF" stroke="#B45309" stroke-width="0.8"/>
    <circle cx="106" cy="100" r="3" fill="#FFFFFF" stroke="#B45309" stroke-width="0.8"/>

    <!-- Central Diamond on Main Peak -->
    <polygon points="64,52 70,62 64,72 58,62" fill="url(#sapphire_gem)" stroke="#FDE047" stroke-width="1.2"/>
  </g>
</svg>
