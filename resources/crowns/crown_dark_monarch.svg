<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="obsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="30%" stop-color="#1F2937"/>
      <stop offset="70%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="void_glow_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </linearGradient>
    <radialGradient id="void_eye" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F472B6"/>
      <stop offset="60%" stop-color="#C026D3"/>
      <stop offset="90%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#0F051D"/>
    </radialGradient>
    <filter id="dark_aura" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#C026D3" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#9333EA" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Aura Energy Trails -->
  <g opacity="0.4" filter="url(#dark_aura)">
    <path d="M64 8 Q56 24 64 36 Q72 24 64 8 Z" fill="#E879F9"/>
    <path d="M38 22 Q32 38 42 48 Q44 32 38 22 Z" fill="#C026D3"/>
    <path d="M90 22 Q96 38 86 48 Q84 32 90 22 Z" fill="#C026D3"/>
  </g>

  <!-- Main Shadow Crown Group -->
  <g filter="url(#dark_aura)">
    <!-- Back Horn Layers (Spikes) -->
    <polygon points="64,12 52,50 64,68 76,50" fill="#030712" stroke="#A855F7" stroke-width="1.2"/>
    <polygon points="32,24 24,62 44,70 42,42" fill="#0F172A" stroke="#9333EA" stroke-width="1.2"/>
    <polygon points="96,24 104,62 84,70 86,42" fill="#0F172A" stroke="#9333EA" stroke-width="1.2"/>
    <polygon points="16,40 12,74 30,78 26,56" fill="#030712" stroke="#7E22CE" stroke-width="1"/>
    <polygon points="112,40 116,74 98,78 102,56" fill="#030712" stroke="#7E22CE" stroke-width="1"/>

    <!-- Sharp Main Front Crown Shell -->
    <path d="M12 92 L20 46 L38 68 L64 16 L90 68 L108 46 L116 92 L94 84 L64 92 L34 84 Z" 
          fill="url(#obsidian)" stroke="#C026D3" stroke-width="2" stroke-linejoin="bevel"/>

    <!-- Inner Purple Blade Edges & Runic Channels -->
    <path d="M64 18 L56 58 L64 78 L72 58 Z" fill="url(#void_glow_grad)" opacity="0.85"/>
    <path d="M22 50 L34 68 L28 80 Z" fill="url(#void_glow_grad)" opacity="0.7"/>
    <path d="M106 50 L94 68 L100 80 Z" fill="url(#void_glow_grad)" opacity="0.7"/>

    <!-- Sharp Obsidian Facets -->
    <line x1="64" y1="16" x2="64" y2="78" stroke="#F472B6" stroke-width="1.5"/>
    <line x1="38" y1="68" x2="64" y2="92" stroke="#A855F7" stroke-width="1"/>
    <line x1="90" y1="68" x2="64" y2="92" stroke="#A855F7" stroke-width="1"/>

    <!-- Dark Crown Base Band -->
    <path d="M12 90 L64 96 L116 90 L116 108 L64 114 L12 108 Z" fill="#030712" stroke="#C026D3" stroke-width="2"/>
    <path d="M14 93 L64 99 L114 93 L114 105 L64 111 L14 105 Z" fill="url(#obsidian)"/>

    <!-- Central Glowing Shadow Core (The Sovereign Eye) -->
    <polygon points="64,54 74,68 64,82 54,68" fill="url(#void_eye)" stroke="#F472B6" stroke-width="1.8"/>
    <circle cx="64" cy="68" r="3" fill="#FFFFFF"/>

    <!-- Runic Soul Gems on Base -->
    <polygon points="64,98 70,105 64,112 58,105" fill="url(#void_eye)" stroke="#F472B6" stroke-width="1"/>
    <polygon points="36,96 42,102 36,108 30,102" fill="url(#void_glow_grad)" stroke="#E879F9" stroke-width="0.8"/>
    <polygon points="92,96 98,102 92,108 86,102" fill="url(#void_glow_grad)" stroke="#E879F9" stroke-width="0.8"/>
    <circle cx="20" cy="101" r="2.5" fill="#E879F9"/>
    <circle cx="108" cy="101" r="2.5" fill="#E879F9"/>
  </g>
</svg>
