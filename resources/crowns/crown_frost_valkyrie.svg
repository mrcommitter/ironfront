<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="ice_crystal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#CFFAFE"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="frost_silver" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <radialGradient id="frost_diamond" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#67E8F9"/>
      <stop offset="85%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#082F49"/>
    </radialGradient>
    <filter id="ice_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38BDF8" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#06B6D4" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#ice_glow)">
    <!-- Back Crystal Shards -->
    <polygon points="64,10 54,48 64,62 74,48" fill="#E0F2FE" stroke="#0284C7" stroke-width="1.2"/>
    <polygon points="40,24 32,58 48,64" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <polygon points="88,24 96,58 80,64" fill="#BAE6FD" stroke="#0284C7" stroke-width="1"/>
    <polygon points="20,40 16,72 32,74" fill="#7DD3FC" stroke="#0369A1" stroke-width="0.8"/>
    <polygon points="108,40 112,72 96,74" fill="#7DD3FC" stroke="#0369A1" stroke-width="0.8"/>

    <!-- Main Front Ice Spires / Tiara Body -->
    <path d="M14 92 L24 48 L38 68 L64 16 L90 68 L104 48 L114 92 L64 86 Z" 
          fill="url(#ice_crystal)" stroke="#0284C7" stroke-width="1.8" stroke-linejoin="round"/>

    <!-- Sharp Crystal Facets (Geometric 3D Ice) -->
    <polygon points="64,16 64,86 52,66" fill="#FFFFFF" opacity="0.45"/>
    <polygon points="64,16 64,86 76,66" fill="#0369A1" opacity="0.3"/>
    <polygon points="24,48 38,68 28,88" fill="#FFFFFF" opacity="0.35"/>
    <polygon points="104,48 90,68 100,88" fill="#0369A1" opacity="0.35"/>

    <!-- Snowflake Star in Center -->
    <g transform="translate(64,58)">
      <line x1="0" y1="-14" x2="0" y2="14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <line x1="-12" y1="-7" x2="12" y2="7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <line x1="-12" y1="7" x2="12" y2="-7" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4.5" fill="url(#frost_diamond)" stroke="#FFFFFF" stroke-width="1"/>
    </g>

    <!-- Platinum / Silver Glacial Base -->
    <rect x="14" y="90" width="100" height="20" rx="3.5" fill="url(#frost_silver)" stroke="#0284C7" stroke-width="2"/>
    <rect x="18" y="94" width="92" height="12" rx="2" fill="#082F49" opacity="0.4"/>

    <!-- Brilliant Cut Diamonds on Rim -->
    <polygon points="64,95 71,100 64,105 57,100" fill="url(#frost_diamond)" stroke="#FFFFFF" stroke-width="1.2"/>
    <polygon points="40,95 46,100 40,105 34,100" fill="url(#frost_diamond)" stroke="#FFFFFF" stroke-width="1"/>
    <polygon points="88,95 94,100 88,105 82,100" fill="url(#frost_diamond)" stroke="#FFFFFF" stroke-width="1"/>
    <circle cx="22" cy="100" r="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
    <circle cx="106" cy="100" r="3" fill="#E0F2FE" stroke="#0284C7" stroke-width="0.8"/>
  </g>
</svg>
