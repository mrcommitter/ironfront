<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cyrus_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="40%" stop-color="#FFC107"/>
      <stop offset="80%" stop-color="#FFA000"/>
      <stop offset="100%" stop-color="#FF6F00"/>
    </linearGradient>
    <radialGradient id="turquoise" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="40%" stop-color="#14B8A6"/>
      <stop offset="85%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </radialGradient>
    <radialGradient id="lapis" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="85%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </radialGradient>
    <radialGradient id="sun_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="30%" stop-color="#FEF08A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <filter id="cyrus_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#F59E0B" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#cyrus_glow)">
    <!-- Radiating Solar Sunburst at Top -->
    <g opacity="0.95">
      <line x1="64" y1="36" x2="64" y2="10" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="56" y1="38" x2="44" y2="15" stroke="#FFCA28" stroke-width="2" stroke-linecap="round"/>
      <line x1="72" y1="38" x2="84" y2="15" stroke="#FFCA28" stroke-width="2" stroke-linecap="round"/>
      <line x1="48" y1="42" x2="30" y2="24" stroke="#FFA000" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="80" y1="42" x2="98" y2="24" stroke="#FFA000" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="42" y1="48" x2="20" y2="38" stroke="#FF8F00" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="86" y1="48" x2="108" y2="38" stroke="#FF8F00" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="64" cy="28" r="7" fill="url(#sun_core)" stroke="#FFB300" stroke-width="1"/>
    </g>

    <!-- Persian Persepolis Stepped Crenellations / Crown Body -->
    <path d="M18 92 L22 62 L32 62 L32 50 L42 50 L42 38 L54 38 L54 26 L74 26 L74 38 L86 38 L86 50 L96 50 L96 62 L106 62 L110 92 Z" 
          fill="url(#cyrus_gold)" stroke="#78350F" stroke-width="2" stroke-linejoin="round"/>

    <!-- Inner Engravings & Sacred Wings -->
    <path d="M64 42 C50 42 38 52 30 68 C45 64 56 56 64 48 C72 56 83 64 98 68 C90 52 78 42 64 42 Z" fill="#B45309" opacity="0.35"/>
    <!-- Wing Feathers -->
    <path d="M64 50 Q48 58 36 74 Q52 68 64 60 Q76 68 92 74 Q80 58 64 50 Z" fill="#FFFBEB" opacity="0.3"/>

    <!-- Royal Faravahar Sun Emblem in Center -->
    <circle cx="64" cy="62" r="9" fill="url(#turquoise)" stroke="#FFD54F" stroke-width="1.8"/>
    <circle cx="64" cy="62" r="4" fill="url(#sun_core)"/>

    <!-- Stepped Rim Accents (Lapis Lazuli Insets) -->
    <polygon points="64,30 68,36 60,36" fill="url(#lapis)"/>
    <rect x="34" y="52" width="6" height="8" rx="1.5" fill="url(#turquoise)" stroke="#D97706" stroke-width="0.8"/>
    <rect x="88" y="52" width="6" height="8" rx="1.5" fill="url(#turquoise)" stroke="#D97706" stroke-width="0.8"/>
    <rect x="44" y="40" width="8" height="8" rx="1.5" fill="url(#lapis)" stroke="#D97706" stroke-width="0.8"/>
    <rect x="76" y="40" width="8" height="8" rx="1.5" fill="url(#lapis)" stroke="#D97706" stroke-width="0.8"/>

    <!-- Royal Base Band -->
    <rect x="16" y="90" width="96" height="20" rx="3" fill="#D97706" stroke="#78350F" stroke-width="2"/>
    <rect x="18" y="92" width="92" height="16" rx="2" fill="url(#cyrus_gold)"/>

    <!-- Turquoise & Gold Studs along the Base -->
    <circle cx="28" cy="100" r="4.5" fill="url(#turquoise)" stroke="#78350F" stroke-width="1"/>
    <circle cx="46" cy="100" r="4" fill="url(#lapis)" stroke="#78350F" stroke-width="1"/>
    <circle cx="64" cy="100" r="5.5" fill="url(#turquoise)" stroke="#78350F" stroke-width="1.2"/>
    <circle cx="82" cy="100" r="4" fill="url(#lapis)" stroke="#78350F" stroke-width="1"/>
    <circle cx="100" cy="100" r="4.5" fill="url(#turquoise)" stroke="#78350F" stroke-width="1"/>
    
    <!-- Gold Pips -->
    <circle cx="37" cy="100" r="1.8" fill="#FFFBEB"/>
    <circle cx="55" cy="100" r="1.8" fill="#FFFBEB"/>
    <circle cx="73" cy="100" r="1.8" fill="#FFFBEB"/>
    <circle cx="91" cy="100" r="1.8" fill="#FFFBEB"/>
  </g>
</svg>
